name: CI Staging Branch

on:
  push:
    branches:
      - stage
      - main

  pull_request:
    types:
      - closed

    branches-ignore:
      - "renovate/**"

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.17" # Specify the version of Node.js

      - name: Install dependencies
        run: npm install

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          build: npm run build

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: build
  run-tests:
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folder
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Run Cypress component tests
        run: yarn run cypress:run:component

      - name: Run Cypress API tests
        run: yarn run test:api

      - name: Run Cypress UI tests on Chrome
        uses: cypress-io/github-action@v6
        with:
          start: yarn run test:ui
          browser: chrome

      - name: Run Cypress UI tests on Firefox
        uses: cypress-io/github-action@v6
        with:
          start: yarn run test:ui
          browser: firefox

      - name: Run Cypress UI tests on Firefox mobile
        uses: cypress-io/github-action@v6
        with:
          start: npm run cypress:run:mobile
          browser: firefox

      - name: Run Cypress UI tests on Chrome mobile
        uses: cypress-io/github-action@v6
        with:
          start: npm run cypress:run:mobile
          browser: chrome

      - name: Archive test results
        uses: actions/upload-artifact@v2
        with:
          name: test-results
